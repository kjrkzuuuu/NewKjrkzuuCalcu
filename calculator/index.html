<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calcustyle.css">
</head>
<body>
    <div id="bigbox">
        <div>
            <input  id="inputbox" type="text" readonly>
        </div>    
        <div class="buttons">
            <button onclick="ClearDisplay('C')" class="operator">C</button>
            <button onclick="appendToDisplay('/')" class="operator">/</button>
            <button onclick="appendToDisplay('*')" class="operator">x</button>
            <button onclick="DelBtn('Del')" class="operator">Del</button>

            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('-')" class="operator">-</button>

            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('+')" class="operator">+</button>

            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
          
            <button onclick="EqualBtn('=')" class="equal">=</button>
           
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>

            <div>
                <button id="relapseMode">RELAPSE</button>
            </div>    

        </div>
        <h1>K j r k z u u   C a l c</h1>
    </div> 
    <script src="indexcalcu.js"></script>
</body>
</html>
